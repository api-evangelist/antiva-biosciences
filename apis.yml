name: Antiva Biosciences
description: Antiva Biosciences is a clinical-stage biopharmaceutical company developing topical
  therapeutics that target oncogenic human papillomavirus (HPV) infections and the precancerous
  cervical lesions they cause, aiming to stop cervical cancer before it starts with at-home,
  non-surgical treatment. Its lead candidate, ABI-2280, is a topical antiviral in Phase 1b/2
  clinical development for high-risk cervical HPV infection, and the company frames its work in
  support of the World Health Organization's global Cervical Cancer Elimination Initiative. Antiva
  is backed by venture investors including Canaan Partners and GV, and is tracked in the API
  Evangelist network as a company profile awaiting further enrichment.
